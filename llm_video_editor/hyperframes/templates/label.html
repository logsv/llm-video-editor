<!doctype html>
<!-- llmve built-in template: label pointing at something in the shot (a cow, the temple, the highway)
     Size placeholders (width, height, duration, unit) are filled by
     llm_video_editor.hyperframes.compose; text comes from --variables.
     x, y: the point to mark, 0-1 of the frame (e.g. a box centre from the `objects` tool). -->
<html lang="en" data-composition-variables='[
  {"id":"text_color","type":"color","label":"Text colour","default":"#FFFFFF"},
  {"id":"text","type":"string","label":"Label","default":"Peacock"},
  {"id":"detail","type":"string","label":"Second line (optional)","default":""},
  {"id":"x","type":"number","label":"Point x (0-1)","default":0.5},
  {"id":"y","type":"number","label":"Point y (0-1)","default":0.5},
  {"id":"accent","type":"color","label":"Accent","default":"#FFC93C"}
]'>
<head>
<meta charset="utf-8">
<script src="assets/gsap.min.js"></script>
<style>
  html, body { margin: 0; background: transparent; }
  #root { position: relative; width: __W__px; height: __H__px; overflow: hidden;
          font-family: "Inter", "Helvetica Neue", Arial, sans-serif; --u: __U__px; }
  #dot { position: absolute; width: calc(var(--u) * 1.8); height: calc(var(--u) * 1.8);
         margin: calc(var(--u) * -0.9) 0 0 calc(var(--u) * -0.9); border-radius: 50%;
         background: var(--accent); box-shadow: 0 0 0 calc(var(--u) * 0.45) rgba(255,255,255,0.9),
         0 0 calc(var(--u) * 1.6) rgba(0,0,0,0.6); }
  #ring { position: absolute; width: calc(var(--u) * 5); height: calc(var(--u) * 5);
          margin: calc(var(--u) * -2.5) 0 0 calc(var(--u) * -2.5); border-radius: 50%;
          border: calc(var(--u) * 0.3) solid var(--accent); }
  #line { position: absolute; height: calc(var(--u) * 0.3); background: #fff;
          transform-origin: 0 50%; box-shadow: 0 0 calc(var(--u) * 0.6) rgba(0,0,0,0.6); }
  #tag { position: absolute; padding: calc(var(--u) * 1.1) calc(var(--u) * 2);
         border-radius: calc(var(--u) * 1); background: rgba(12, 14, 20, 0.88); color: var(--text, #FFFFFF);
         border-left: calc(var(--u) * 0.6) solid var(--accent); white-space: nowrap; }
  #text { font-size: calc(var(--u) * 3.6); font-weight: 700; line-height: 1.1; }
  #detail { font-size: calc(var(--u) * 2.3); opacity: 0.85; margin-top: calc(var(--u) * 0.3); }
  #root.portrait { --u: calc(__U__px * 1.3); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="__D__"
     data-width="__W__" data-height="__H__">
  <div id="line"></div><div id="ring"></div><div id="dot"></div>
  <div id="tag"><div id="text"></div><div id="detail"></div></div>
</div>
<script>
  const v = window.__hyperframes.getVariables();
  const W = __W__, H = __H__, U = __U__ * (H > W ? 1.3 : 1);
  const root = document.getElementById("root");
  root.style.setProperty("--accent", v.accent);
  document.getElementById("root").style.setProperty("--text", v.text_color || "#FFFFFF");
  if (H > W) root.classList.add("portrait");
  document.getElementById("text").textContent = v.text;
  const detail = document.getElementById("detail");
  detail.textContent = v.detail || "";
  if (!v.detail) detail.style.display = "none";
  const clamp = (a, lo, hi) => Math.min(hi, Math.max(lo, a));
  const px = clamp(Number(v.x), 0.03, 0.97) * W, py = clamp(Number(v.y), 0.05, 0.95) * H;
  for (const id of ["dot", "ring"]) {
    const el = document.getElementById(id);
    el.style.left = px + "px"; el.style.top = py + "px";
  }
  // the tag sits up and away from the point, towards the middle of the frame
  const tag = document.getElementById("tag");
  const tw = tag.offsetWidth, th = tag.offsetHeight, reach = U * 14;
  const dx = px < W / 2 ? 1 : -1, dy = py > H * 0.35 ? -1 : 1;
  let tx = px + dx * reach * 0.8, ty = py + dy * reach * 0.6;
  tx = dx > 0 ? tx : tx - tw;
  ty = dy > 0 ? ty : ty - th;
  tx = clamp(tx, U * 3, W - tw - U * 3); ty = clamp(ty, U * 3, H - th - U * 3);
  tag.style.left = tx + "px"; tag.style.top = ty + "px";
  const ax = dx > 0 ? tx : tx + tw, ay = ty + th / 2;
  const line = document.getElementById("line");
  line.style.left = px + "px"; line.style.top = py + "px";
  line.style.width = Math.hypot(ax - px, ay - py) + "px";
  line.style.transform = `rotate(${Math.atan2(ay - py, ax - px)}rad)`;
  const D = __D__;
  const tl = gsap.timeline({ paused: true });
  gsap.set("#dot", { scale: 0 }); gsap.set("#ring", { scale: 0.3, opacity: 0 });
  gsap.set("#line", { scaleX: 0 }); gsap.set("#tag", { opacity: 0, y: dy * 10 });
  tl.to("#dot", { scale: 1, duration: 0.3, ease: "back.out(3)" }, 0.05);
  tl.to("#ring", { scale: 1, opacity: 1, duration: 0.4, ease: "power2.out" }, 0.1);
  tl.to("#ring", { scale: 1.6, opacity: 0, duration: 0.6, ease: "power1.out" }, 0.5);
  tl.to("#line", { scaleX: 1, duration: 0.35, ease: "power2.out" }, 0.2);
  tl.to("#tag", { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.45);
  tl.to(["#dot", "#line", "#tag"], { opacity: 0, duration: 0.3, ease: "power2.in" },
        Math.max(0.9, D - 0.35));
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
