<!doctype html>
<!-- llmve built-in template: name/role lower third
     Size placeholders (width, height, duration, unit) are filled by
     llm_video_editor.hyperframes.compose; text comes from --variables. -->
<html lang="en" data-composition-variables='[
  {"id":"text_color","type":"color","label":"Text colour","default":"#FFFFFF"},
  {"id":"title","type":"string","label":"Name","default":"Your Name"},
  {"id":"subtitle","type":"string","label":"Role","default":"What you do"},
  {"id":"accent","type":"color","label":"Accent","default":"#FFC93C"},
  {"id":"position","type":"string","label":"bottom-left | top-left | bottom-center","default":"bottom-left"}
]'>
<head>
<meta charset="utf-8">
<script src="assets/gsap.min.js"></script>
<style>
  html, body { margin: 0; background: transparent; }
  #root { position: relative; width: __W__px; height: __H__px; overflow: hidden;
          font-family: "Inter", "Helvetica Neue", Arial, sans-serif; --u: __U__px; }
  #card { position: absolute; left: max(calc(var(--u) * 6), 6%); bottom: calc(var(--u) * 12);
          display: flex; align-items: stretch; border-radius: calc(var(--u) * 1.2);
          background: rgba(12, 14, 20, 0.88); color: var(--text, #FFFFFF); overflow: hidden;
          box-shadow: 0 calc(var(--u) * 0.6) calc(var(--u) * 2.4) rgba(0, 0, 0, 0.35); }
  #bar { width: calc(var(--u) * 0.7); background: var(--accent); }
  #text { padding: calc(var(--u) * 1.6) calc(var(--u) * 2.6) calc(var(--u) * 1.6) calc(var(--u) * 2.2); }
  #title { font-size: calc(var(--u) * 4.6); font-weight: 700; line-height: 1.1; }
  #subtitle { font-size: calc(var(--u) * 2.7); opacity: 0.82; margin-top: calc(var(--u) * 0.5); }
  .top-left #card { bottom: auto; top: max(calc(var(--u) * 8), 6%); }
  .bottom-center #card { left: 50%; transform: translateX(-50%); }
  /* 9:16: bigger, and above the caption band burned into Shorts/Reels */
  #root.portrait { --u: calc(__U__px * 1.3); }
  #root.portrait #card { bottom: 30%; }
  #root.portrait.top-left #card { bottom: auto; top: 14%; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="__D__"
     data-width="__W__" data-height="__H__">
  <div id="card"><div id="bar"></div>
    <div id="text"><div id="title"></div><div id="subtitle"></div></div></div>
</div>
<script>
  const v = window.__hyperframes.getVariables();
  const root = document.getElementById("root");
  root.style.setProperty("--accent", v.accent);
  document.getElementById("root").style.setProperty("--text", v.text_color || "#FFFFFF");
  root.classList.add(v.position);
  if (__H__ > __W__) root.classList.add("portrait");
  document.getElementById("title").textContent = v.title;
  document.getElementById("subtitle").textContent = v.subtitle;
  const D = __D__;
  const tl = gsap.timeline({ paused: true });
  gsap.set("#text", { opacity: 0, x: -24 });
  gsap.set("#bar", { scaleY: 0, transformOrigin: "50% 100%" });
  gsap.set("#card", { opacity: 0 });
  tl.to("#card", { opacity: 1, duration: 0.2 }, 0.05);
  tl.to("#bar", { scaleY: 1, duration: 0.35, ease: "power3.out" }, 0.05);
  tl.to("#text", { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.15);
  tl.to("#card", { opacity: 0, duration: 0.3, ease: "power2.in" }, Math.max(0.8, D - 0.35));
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
