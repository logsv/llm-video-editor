<!doctype html>
<!-- llmve built-in template: place title with a map pin (where we are: town, road, temple)
     Size placeholders (width, height, duration, unit) are filled by
     llm_video_editor.hyperframes.compose; text comes from --variables. -->
<html lang="en" data-composition-variables='[
  {"id":"title","type":"string","label":"Place","default":"Khajuraho"},
  {"id":"subtitle","type":"string","label":"Detail (region, road, distance)","default":"Madhya Pradesh, India"},
  {"id":"accent","type":"color","label":"Pin colour","default":"#FF5A4E"},
  {"id":"position","type":"string","label":"top-left | bottom-left | top-right | center","default":"top-left"}
]'>
<head>
<meta charset="utf-8">
<script src="assets/gsap.min.js"></script>
<style>
  html, body { margin: 0; background: transparent; }
  #root { position: relative; width: __W__px; height: __H__px; overflow: hidden;
          font-family: "Inter", "Helvetica Neue", Arial, sans-serif; --u: __U__px; }
  #card { position: absolute; left: max(calc(var(--u) * 6), 6%); top: max(calc(var(--u) * 7), 6%);
          display: flex; align-items: center; gap: calc(var(--u) * 1.6); color: #fff;
          text-shadow: 0 calc(var(--u) * 0.3) calc(var(--u) * 1.6) rgba(0, 0, 0, 0.75); }
  #pin { width: calc(var(--u) * 5.2); height: calc(var(--u) * 5.2); flex: none;
         filter: drop-shadow(0 calc(var(--u) * 0.3) calc(var(--u) * 0.8) rgba(0, 0, 0, 0.6)); }
  #pin path { fill: var(--accent); }
  #pin circle { fill: #fff; }
  #title { font-size: calc(var(--u) * 5.4); font-weight: 800; line-height: 1.05;
           letter-spacing: 0.01em; }
  #rule { height: calc(var(--u) * 0.35); background: var(--accent); margin: calc(var(--u) * 0.7) 0;
          transform-origin: 0 50%; }
  #subtitle { font-size: calc(var(--u) * 2.8); font-weight: 500; opacity: 0.92;
              letter-spacing: 0.04em; text-transform: uppercase; }
  .bottom-left #card { top: auto; bottom: calc(var(--u) * 12); }
  .top-right #card { left: auto; right: max(calc(var(--u) * 6), 6%); flex-direction: row-reverse;
                     text-align: right; }
  .top-right #rule { transform-origin: 100% 50%; }
  .center #card { left: 50%; top: 50%; transform: translate(-50%, -50%);
                  flex-direction: column; text-align: center; }
  .center #rule { transform-origin: 50% 50%; }
  /* 9:16: bigger, clear of the platform's top bar and the caption band */
  #root.portrait { --u: calc(__U__px * 1.3); }
  #root.portrait #card { top: 12%; }
  #root.portrait.bottom-left #card { top: auto; bottom: 32%; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="__D__"
     data-width="__W__" data-height="__H__">
  <div id="card">
    <svg id="pin" viewBox="0 0 24 24"><path d="M12 1.5c-4.3 0-7.8 3.4-7.8 7.7 0 5.6 7.8 13.3 7.8 13.3s7.8-7.7 7.8-13.3c0-4.3-3.5-7.7-7.8-7.7z"/><circle cx="12" cy="9.2" r="3"/></svg>
    <div id="text"><div id="title"></div><div id="rule"></div><div id="subtitle"></div></div>
  </div>
</div>
<script>
  const v = window.__hyperframes.getVariables();
  const root = document.getElementById("root");
  root.style.setProperty("--accent", v.accent);
  root.classList.add(v.position);
  if (__H__ > __W__) root.classList.add("portrait");
  document.getElementById("title").textContent = v.title;
  document.getElementById("subtitle").textContent = v.subtitle;
  if (!v.subtitle) document.getElementById("rule").style.display = "none";
  const D = __D__;
  const tl = gsap.timeline({ paused: true });
  gsap.set("#pin", { opacity: 0, y: -30, scale: 0.6 });
  gsap.set("#title", { opacity: 0, x: -20 });
  gsap.set("#rule", { scaleX: 0 });
  gsap.set("#subtitle", { opacity: 0, y: 8 });
  tl.to("#pin", { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(2.2)" }, 0.05);
  tl.to("#title", { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.25);
  tl.to("#rule", { scaleX: 1, duration: 0.4, ease: "power2.out" }, 0.45);
  tl.to("#subtitle", { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.6);
  tl.to("#card", { opacity: 0, duration: 0.35, ease: "power2.in" }, Math.max(1.0, D - 0.4));
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
