<!doctype html>
<!-- llmve built-in template: one keyword or short phrase that pops in. -->
<html lang="en" data-composition-variables='[
  {"id":"text","type":"string","label":"Text","default":"Key idea"},
  {"id":"accent","type":"color","label":"Accent","default":"#FFC93C"},
  {"id":"position","type":"string","label":"top | center","default":"top"}
]'>
<head>
<meta charset="utf-8">
<script src="assets/gsap.min.js"></script>
<style>
  html, body { margin: 0; background: transparent; }
  #root { position: relative; width: __W__px; height: __H__px; overflow: hidden;
          font-family: "Inter", "Helvetica Neue", Arial, sans-serif; --u: __U__px; }
  #wrap { position: absolute; left: 50%; top: 12%; transform: translateX(-50%); max-width: 86%; }
  .center #wrap { top: 50%; transform: translate(-50%, -50%); }
  #pill { padding: calc(var(--u) * 1.4) calc(var(--u) * 3.2);
          border-radius: calc(var(--u) * 6); background: #fff; color: #0b0c10;
          font-size: calc(var(--u) * 5.2); font-weight: 800; text-align: center;
          box-shadow: 0 0 0 calc(var(--u) * 0.6) var(--accent),
                      0 calc(var(--u) * 0.8) calc(var(--u) * 3) rgba(0, 0, 0, 0.35); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="__D__"
     data-width="__W__" data-height="__H__">
  <div id="wrap"><div id="pill"></div></div>
</div>
<script>
  const v = window.__hyperframes.getVariables();
  const root = document.getElementById("root");
  root.style.setProperty("--accent", v.accent);
  root.classList.add(v.position);
  document.getElementById("pill").textContent = v.text;
  const D = __D__;
  const tl = gsap.timeline({ paused: true });
  gsap.set("#pill", { opacity: 0, scale: 0.6 });
  tl.to("#pill", { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 0.05);
  tl.to("#pill", { opacity: 0, scale: 0.9, duration: 0.25, ease: "power2.in" },
        Math.max(0.6, D - 0.3));
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
</body>
</html>
