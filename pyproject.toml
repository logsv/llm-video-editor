[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-video-editor"
version = "0.3.0"
description = "Checkpointed, prompt-driven video editor: watch, plan, cut-audit, geometry, review, render"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "LLM Video Editor Team", email = "team@llm-video-editor.dev"}
]
keywords = ["video", "editing", "llm", "ai", "automation", "reels", "youtube"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"

# Core dependencies: the stage pipeline (watch -> plan -> cut-audit -> render).
# Heavy ML stacks live in extras so the core installs in seconds.
dependencies = [
    "pydantic>=2.7,<3",
    "typer>=0.12.3",
    "rich>=13.7.0",
    "requests>=2.32",
    "faster-whisper>=1.0.3",
]

[project.optional-dependencies]
# Face/subject geometry (take-geometry). MediaPipe is CPU-friendly.
vision = [
    "mediapipe>=0.10.14",
    "opencv-python-headless>=4.10",
]
# Pro polish: YOLO person fallback, music ducking.
pro = [
    "ultralytics>=8.3.4",
    "demucs>=4.0.1",
    "librosa>=0.10.2",
    "soundfile>=0.12.1",
]
# Generative B-roll fallback (Open-Sora / Stable Video Diffusion).
gen = [
    "torch>=2.4",
    "diffusers>=0.29.0",
    "transformers>=4.45",
    "accelerate>=0.31.0",
    "Pillow>=10.4",
]
# Secondary planner providers (the default `claude-cli` provider needs no Python SDK).
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
# LangGraph orchestration with a human-in-the-loop interrupt at the review gate.
graph = ["langgraph>=0.2.34"]
dev = [
    "langgraph>=0.2.34",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.6",
]
all = ["llm-video-editor[vision,pro,gen,anthropic,openai,graph]"]

[project.scripts]
llmve = "llm_video_editor.cli.app:app"
llm-video-router = "llm_video_editor.cli.app:app"
llm-video-editor = "llm_video_editor.cli.app:app"

[project.urls]
Repository = "https://github.com/logsv/llm-video-editor"
Issues = "https://github.com/logsv/llm-video-editor/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_video_editor*"]

[tool.setuptools.package-data]
llm_video_editor = ["py.typed"]

# Ruff (lint + import sorting)
[tool.ruff]
line-length = 100
target-version = "py311"
# Optional/legacy-style modules kept as-is (generative B-roll clients, music ducking).
extend-exclude = [
    "llm_video_editor/generative",
    "llm_video_editor/audio/music_ducking.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# Coverage configuration
[tool.coverage.run]
source = ["llm_video_editor"]
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
